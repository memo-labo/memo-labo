<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">キュービクル清掃のイメージ</title><desc id="desc">キュービクル内の盤面を清掃する前後を示したイラスト</desc><rect width="1200" height="675" fill="#f4f6f8"/><rect x="55" y="65" width="1090" height="545" rx="20" fill="#fff" stroke="#c9d2dc" stroke-width="4"/><text x="90" y="125" font-family="sans-serif" font-size="42" font-weight="700" fill="#17365d">キュービクル内の清掃</text><rect x="90" y="165" width="460" height="350" rx="12" fill="#d7d4cd"/><rect x="650" y="165" width="460" height="350" rx="12" fill="#eef2f4"/><text x="115" y="215" font-family="sans-serif" font-size="32" font-weight="700" fill="#555">清掃前</text><text x="675" y="215" font-family="sans-serif" font-size="32" font-weight="700" fill="#1769aa">清掃後</text><g fill="#777" opacity=".45"><circle cx="170" cy="290" r="12"/><circle cx="270" cy="380" r="17"/><circle cx="420" cy="260" r="10"/><circle cx="470" cy="430" r="15"/><path d="M130 455l90-45 55 20 80-60 130 45v65H130z"/></g><g stroke="#9aa6b2" stroke-width="9" fill="none"><path d="M710 275h340M710 345h340M710 415h340"/><circle cx="760" cy="275" r="18"/><circle cx="900" cy="345" r="18"/><circle cx="1020" cy="415" r="18"/></g><path d="M565 335h70" stroke="#1769aa" stroke-width="16"/><path d="M625 305l38 30-38 30" fill="none" stroke="#1769aa" stroke-width="16" stroke-linejoin="round"/><text x="90" y="570" font-family="sans-serif" font-size="27" fill="#333">ホコリ・汚れを落とし、盤面や金属面をきれいに。</text><text x="90" y="603" font-family="sans-serif" font-size="22" fill="#666">※清掃は停電・検電など必要な安全措置を行い、水分を充電部や機器内部へ入れない。</text></svg>